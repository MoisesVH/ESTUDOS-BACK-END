<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio022</title>
    
    <style>
        body {
            background-color: #5f5f5f;
            font-family: monospace;
            color: #f5f5f5;
            font-size: 16px;
            margin: 0;
            padding: 0;
        }
        h1 {
            background-color: #f5f5f5;
            color: #5f5f5f;
            font-size: 28px;
            padding: 10px;
        }
        form {
            background-color: #f5f5f5;
            color: #5f5f5f;
            margin: auto;
            padding: 20px;
            width: 500px;
            border-radius: 20px;
        }
        form h1 {
            background-color: #5f5f5f;
            color: #f5f5f5;
            font-size: 20px;
            margin-top: 0px;
            padding: 10px;
            border-radius: 10px;
        }
        input {
            background: #f5f5f5;
            height: 20px;
            margin: 5px;
            border: 1px solid #5f5f5f;
            border-radius: 5px;
        }
        .btn {
            background-color: #5f5f5f;
            color: #f5f5f5;
            width: 100%;
            height: 35px;
            margin-top: 15px;
            margin-bottom: 0;
            border: none;
            border-radius: 10px;
        }
        .result {
            background-color: #f5f5f5;
            color: #5f5f5f;
            margin: 20px auto;
            padding: 20px;
            width: 500px;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <h1>Exércicio 022</h1>
    <div class="result">
        <h2>Contando...</h2>
        <label for="n">Informe um valor:</label>
        <input type="number" id="n">
        <button class="btn" onclick="contador()">Mostrar intervalo</button>
        <div id="result"></div>
    </div>

    <script> 
        'use strict'
        
        function contador() {
            let n = document.getElementById("n").value;
            let result = document.getElementById("result");
            
            if (n > 0) {
                result.innerHTML = `
                    <p>Intervalo de 1 a ${n}:</p>
                    <p>
                `;
                for (let i = 1; i <= n; i++) {
                    if (i == n) {
                        result.innerHTML += `${i}.</p>`;
                        break;
                    }
                    result.innerHTML += `${i}, `;
                }
            } 
            else {
                alert("Informe uma valor maior que 0!")
            }
            
        }        
    </script>
</body>
</html>
