<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio006</title>
    <script>
        function calculo() {
            let slr = parseInt(document.getElementById("salario").value);
            let cmss = parseInt(document.getElementById("comissao").value);
            let totalCarros = parseInt(document.getElementById("qntCarros").value);
            let totalVendido = parseInt(document.getElementById("vendas").value);
            let slrTotal = slr+(cmss*totalCarros)+(totalVendido*0.05);
            let result = document.getElementById("result");
            result.className = "result";
            result.innerHTML = `<p>Salário total: R$${slrTotal}</p>`;
        };
    </script>
    <style>
        body {
            background-color: #5f5f5f;
            font-family: monospace;
            color: #f5f5f5;
            font-size: 16px;
            margin: 0;
            padding: 0;
        }
        h1 {
            background-color: #f5f5f5;
            color: #5f5f5f;
            font-size: 28px;
            padding: 10px;
        }
        form {
            background-color: #f5f5f5;
            color: #5f5f5f;
            margin: auto;
            padding: 20px;
            width: 500px;
            border-radius: 20px;
        }
        form h1 {
            background-color: #5f5f5f;
            color: #f5f5f5;
            font-size: 20px;
            margin-top: 0px;
            padding: 10px;
            border-radius: 10px;
        }
        input {
            background: #f5f5f5;
            height: 20px;
            margin: 5px;
            border: 1px solid #5f5f5f;
            border-radius: 5px;
        }
        #btn {
            background-color: #5f5f5f;
            color: #f5f5f5;
            width: 100%;
            height: 35px;
            margin-top: 15px;
            margin-bottom: 0;
            border: none;
            border-radius: 10px;
        }
        .result {
            background-color: #f5f5f5;
            color: #5f5f5f;
            margin: 20px auto;
            padding: 20px;
            width: 500px;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <h1>Exércicio 006</h1>
    <form>
        <h1>Calcule seu salário</h1>
        <label for="salario">Salário (R$):</label>
        <input type="number" id="salario">
        <br>
        <label for="comissao">Comissão por venda (R$):</label>
        <input type="number" id="comissao">
        <br>
        <label for="qntCarros">Carros vendidos:</label>
        <input type="number" id="qntCarros">
        <br>
        <label for="vendas">Total vendido (R$):</label>
        <input type="number" id="vendas">
        <input id="btn" type="button" value="Enviar" onclick="calculo()">
    </form>
    <div id="result"></div>
</body>
</html>
