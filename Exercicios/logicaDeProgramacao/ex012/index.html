<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio012</title>
    <script>
        function calculo() {
            let conta = document.getElementById("conta").value;
            let saldo = parseFloat(document.getElementById("saldo").value);
            let acao = document.getElementById("acao").value;
            let valor = parseFloat(document.getElementById("vlr").value);
            let result = document.getElementById("result");
            if (!conta && conta!=0 || !saldo && saldo!=0 || acao == 0 || !valor && valor!=0) {
                alert("Você deixou alguma valor em branco!")
            } else {
                result.className = "result"
                if (acao == 1) {
                    saldo -= valor
                    result.innerHTML = `
                    <p>Conta: ${conta}</P>
                    <p>Saldo (R$): ${saldo}</p>`;
                } else {
                    saldo += valor
                    result.innerHTML = `
                    <p>Conta: ${conta}</P>
                    <p>Saldo (R$): ${saldo}</p>`;
                }
            };
        };
    </script>
    <style>
        body {
            background-color: #5f5f5f;
            font-family: monospace;
            color: #f5f5f5;
            font-size: 16px;
            margin: 0;
            padding: 0;
        }
        h1 {
            background-color: #f5f5f5;
            color: #5f5f5f;
            font-size: 28px;
            padding: 10px;
        }
        form {
            background-color: #f5f5f5;
            color: #5f5f5f;
            margin: auto;
            padding: 20px;
            width: 500px;
            border-radius: 20px;
        }
        form h1 {
            background-color: #5f5f5f;
            color: #f5f5f5;
            font-size: 20px;
            margin-top: 0px;
            padding: 10px;
            border-radius: 10px;
        }
        input {
            background: #f5f5f5;
            width: 150px;
            height: 20px;
            margin: 5px;
            border: 1px solid #5f5f5f;
            border-radius: 5px;
        }
        select {
            background: #f5f5f5;
            color: #5f5f5f;
            width: 150px;
            height: 25px;
            margin: 5px;
            border: 1px solid #5f5f5f;
            border-radius: 5px;
        }
        #btn {
            background-color: #5f5f5f;
            color: #f5f5f5;
            width: 100%;
            height: 35px;
            margin-top: 15px;
            margin-bottom: 0;
            border: none;
            border-radius: 10px;
        }
        .result {
            background-color: #f5f5f5;
            color: #5f5f5f;
            margin: 20px auto;
            padding: 20px;
            width: 500px;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <h1>Exércicio 012</h1>
    <form>
        <h1>Banco Lógico</h1>
        <label for="conta">Informe o número da conta:</label>
        <input type="number" id="conta">
        <br>
        <label for="saldo">Saldo atual (R$): </label>
        <input type="number" id="saldo">
        <br>
        <label for="acao">Débito ou Crédito:</label>
        <select id="acao">
            <option value="0" selected>Selecione</option>
            <option value="1">Débito</option>
            <option value="2">Crédito</option>
        </select>
        <br>
        <label for="vlr">Digite o valor (R$):</label>
        <input type="number" id="vlr">
        <input id="btn" type="button" value="Enviar" onclick="calculo()">
    </form>
    <div id="result"></div>
</body>
</html>
