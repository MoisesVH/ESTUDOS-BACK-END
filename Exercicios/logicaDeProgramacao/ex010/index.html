<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio010</title>
    <script>
        function calculo() {
            let vlr1 = parseInt(document.getElementById("vlr1").value);
            let vlr2 = parseInt(document.getElementById("vlr2").value);
            let result = document.getElementById("result");
            result.className = "result";
            if (vlr1 == vlr2) {
                result.innerHTML = `<p>Os valores são iguais</p>`;
            } else if (vlr1 > vlr2) {
                result.innerHTML = `<p>O primeiro valor (${vlr1}) é maior</p>`;
            } else {
                result.innerHTML = `<p>O segundo valor (${vlr2}) é maior</p>`;
            };
        };
    </script>
    <style>
        body {
            background-color: #5f5f5f;
            font-family: monospace;
            color: #f5f5f5;
            font-size: 16px;
            margin: 0;
            padding: 0;
        }
        h1 {
            background-color: #f5f5f5;
            color: #5f5f5f;
            font-size: 28px;
            padding: 10px;
        }
        form {
            background-color: #f5f5f5;
            color: #5f5f5f;
            margin: auto;
            padding: 20px;
            width: 500px;
            border-radius: 20px;
        }
        form h1 {
            background-color: #5f5f5f;
            color: #f5f5f5;
            font-size: 20px;
            margin-top: 0px;
            padding: 10px;
            border-radius: 10px;
        }
        input {
            background: #f5f5f5;
            height: 20px;
            margin: 5px;
            border: 1px solid #5f5f5f;
            border-radius: 5px;
        }
        #btn {
            background-color: #5f5f5f;
            color: #f5f5f5;
            width: 100%;
            height: 35px;
            margin-top: 15px;
            margin-bottom: 0;
            border: none;
            border-radius: 10px;
        }
        .result {
            background-color: #f5f5f5;
            color: #5f5f5f;
            margin: 20px auto;
            padding: 20px;
            width: 500px;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <h1>Exércicio 010</h1>
    <form>
        <h1>Compare os valores</h1>
        <label for="vlr1">Primeiro valor:</label>
        <input type="number" id="vlr1">
        <br>
        <label for="vlr2">Segundo valor:</label>
        <input type="number" id="vlr2">
        <input id="btn" type="button" value="Enviar" onclick="calculo()">
    </form>
    <div id="result"></div>
</body>
</html>
