<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio001</title>
    <script>
        function msg() {
            let valor = document.getElementById("valor").value;
            if (valor == NaN || valor == null || valor == "") {
                alert("Você não digitou nenhum valor, insira um valor.");
            } else {
                alert(`O antecessor de ${valor} é o ${valor-1}`);
            };
        };
    </script>
    <style>
        body {
            background-color: #5f5f5f;
            font-family: monospace;
            color: #f5f5f5;
            font-size: 16px;
            margin: 0;
            padding: 0;
        }
        h1 {
            background-color: #f5f5f5;
            color: #5f5f5f;
            font-size: 28px;
            padding: 10px;
        }
        form {
            background-color: #f5f5f5;
            color: #5f5f5f;
            margin: auto;
            padding: 20px;
            width: 400px;
            border-radius: 20px;
        }
        input {
            background: #f5f5f5;
            height: 20px;
            margin: 5px;
            border: 1px solid #5f5f5f;
            border-radius: 5px;
        }
        #btn {
            background-color: #5f5f5f;
            color: #f5f5f5;
            width: 100%;
            height: 35px;
            margin-top: 15px;
            margin-bottom: 0;
            border: none;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <h1>Exercício 001</h1>
    <form>
        <label for="valor">Digite um valor: </label>
        <input id="valor" type="number">
        <input id="btn" type="button" value="Enviar" onclick="msg()">
    </form>
</body>
</html>
