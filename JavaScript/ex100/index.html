<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>praticando</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: monospace;
        }
        .calculadora {
            background-color: #3d3d3d;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
            margin: auto;
            height: 620px;
            width: 450px;
            border-radius: 15px;
        }
        #tela {
            text-align: right;
            background-color: #8f8f8f;
            height: 70px;
            width: 400px;
            border: none;
            border-radius: 15px;
            font-size: 26px;
            color: black;
        }
        .calculadora-botoes {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: space-between;
            width: 400px;
        }
        .botoes {
            background-color: #8f8f8f;
            height: 90px;
            width: 90px;
            border: none;
            border-radius: 15px;
            font-size: 26px;


        }
    </style>
</head>
<body>
    <main class="calculadora">
        <div class="calculadora-tela">
            <input type="number" id="tela">
        </div>
        <div class="calculadora-botoes">
            <button class="botoes">AC</button><button class="botoes">()</button><button class="botoes">%</button><button class="botoes">&#247;</button>
            <button class="botoes" id="1" value="1">1</button><button class="botoes">2</button><button class="botoes">3</button><button class="botoes">x</button>
            <button class="botoes">4</button><button class="botoes">5</button><button class="botoes">6</button><button class="botoes">+</button>
            <button class="botoes">7</button><button class="botoes">8</button><button class="botoes">9</button><button class="botoes">-</button>
            <button class="botoes">0</button><button class="botoes">,</button><button class="botoes">&#9003</button><button class="botoes">=</button>
        </div>
    </main>
    <script src="script.js" defer></script>
</body>
</html>
