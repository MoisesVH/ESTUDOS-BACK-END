<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio023</title>
    
    <style>
        body {
            background-color: #5f5f5f;
            font-family: monospace;
            color: #f5f5f5;
            font-size: 16px;
            margin: 0;
            padding: 0;
        }
        h1 {
            background-color: #f5f5f5;
            color: #5f5f5f;
            font-size: 28px;
            padding: 10px;
        }
        form {
            background-color: #f5f5f5;
            color: #5f5f5f;
            margin: auto;
            padding: 20px;
            width: 500px;
            border-radius: 20px;
        }
        form h1 {
            background-color: #5f5f5f;
            color: #f5f5f5;
            font-size: 20px;
            margin-top: 0px;
            padding: 10px;
            border-radius: 10px;
        }
        input {
            background: #f5f5f5;
            height: 20px;
            margin: 5px;
            border: 1px solid #5f5f5f;
            border-radius: 5px;
        }
        .btn {
            background-color: #5f5f5f;
            color: #f5f5f5;
            width: 100%;
            height: 35px;
            margin-top: 15px;
            margin-bottom: 0;
            border: none;
            border-radius: 10px;
        }
        .result {
            background-color: #f5f5f5;
            color: #5f5f5f;
            margin: 20px auto;
            padding: 20px;
            width: 500px;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <h1>Exércicio 023</h1>
    <div class="result">
        <h2>Tabuada do 8</h2>
        <button class="btn" onclick="tabuada()">calcular</button>
        <div id="result"></div>
    </div>

    <script> 
        'use strict'
        
        function tabuada() {
            let result = document.getElementById("result");
            result.innerHTML = ``;
            for (let i = 1; i <= 10; i++) {
                result.innerHTML += `<p>8 x ${i} = ${8 * i}</p>`;
            }
        }        
    </script>
</body>
</html>
