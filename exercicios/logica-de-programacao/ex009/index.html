<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio009</title>
    <script>
        function calculo() {
            let vlr = parseInt(document.getElementById("vlr").value);
            let result = document.getElementById("result");
            result.className = "result";
            if (vlr > 0) {
                result.innerHTML = `<p>Valor Positivo!</p>`;
            } else if (vlr < 0) {
                result.innerHTML = `<p>Valor Negativo!</p>`;
            } else {
                result.innerHTML = `<p>Você digitou o valor 0</p>`;
            };
        };
    </script>
    <style>
        body {
            background-color: #5f5f5f;
            font-family: monospace;
            color: #f5f5f5;
            font-size: 16px;
            margin: 0;
            padding: 0;
        }
        h1 {
            background-color: #f5f5f5;
            color: #5f5f5f;
            font-size: 28px;
            padding: 10px;
        }
        form {
            background-color: #f5f5f5;
            color: #5f5f5f;
            margin: auto;
            padding: 20px;
            width: 500px;
            border-radius: 20px;
        }
        input {
            background: #f5f5f5;
            height: 20px;
            margin: 5px;
            border: 1px solid #5f5f5f;
            border-radius: 5px;
        }
        #btn {
            background-color: #5f5f5f;
            color: #f5f5f5;
            width: 100%;
            height: 35px;
            margin-top: 15px;
            margin-bottom: 0;
            border: none;
            border-radius: 10px;
        }
        .result {
            background-color: #f5f5f5;
            color: #5f5f5f;
            margin: 20px auto;
            padding: 20px;
            width: 500px;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <h1>Exércicio 009</h1>
    <form>
        <label for="vlr">Digite um valor:</label>
        <input type="number" id="vlr">
        <input id="btn" type="button" value="Enviar" onclick="calculo()">
    </form>
    <div id="result"></div>
</body>
</html>
