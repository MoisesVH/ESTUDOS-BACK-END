<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio013</title>
    <script>
        function calculo() {
            let estoque = parseInt(document.getElementById("qntAtual").value);
            let max = parseInt(document.getElementById("qntMax").value);
            let min = parseInt(document.getElementById("qntMin").value);
            let m = (max+min)/2
            let result = document.getElementById("result");
            result.className = "result";
            if (estoque < m) {
                result.innerHTML = `<p>Efetuar compra</p>`;
            } else {
                result.innerHTML = `<p>Não efetuar compra</p>`;
            };
        };
    </script>
    <style>
        body {
            background-color: #5f5f5f;
            font-family: monospace;
            color: #f5f5f5;
            font-size: 16px;
            margin: 0;
            padding: 0;
        }
        h1 {
            background-color: #f5f5f5;
            color: #5f5f5f;
            font-size: 28px;
            padding: 10px;
        }
        form {
            background-color: #f5f5f5;
            color: #5f5f5f;
            margin: auto;
            padding: 20px;
            width: 500px;
            border-radius: 20px;
        }
        form h1 {
            background-color: #5f5f5f;
            color: #f5f5f5;
            font-size: 20px;
            margin-top: 0px;
            padding: 10px;
            border-radius: 10px;
        }
        input {
            background: #f5f5f5;
            height: 20px;
            margin: 5px;
            border: 1px solid #5f5f5f;
            border-radius: 5px;
        }
        #btn {
            background-color: #5f5f5f;
            color: #f5f5f5;
            width: 100%;
            height: 35px;
            margin-top: 15px;
            margin-bottom: 0;
            border: none;
            border-radius: 10px;
        }
        .result {
            background-color: #f5f5f5;
            color: #5f5f5f;
            margin: 20px auto;
            padding: 20px;
            width: 500px;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <h1>Exércicio 013</h1>
    <form>
        <h1>Avaliação de Estoque</h1>
        <label for="qntAtual">Estoque Atual:</label>
        <input type="number" id="qntAtual">
        <br>
        <label for="qntMax">Quantidade máxima:</label>
        <input type="number" id="qntMax">
        <br>
        <label for="qntMin">Quantidade mínima:</label>
        <input type="number" id="qntMin">
        <input id="btn" type="button" value="Enviar" onclick="calculo()">
    </form>
    <div id="result"></div>
</body>
</html>
